name: Run Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    env:
      GOFLAGS: "-mod=vendor"
      # No TURBOT_* credentials here on purpose. This job runs `make vet` and `make test`, and
      # `make test` is unit tests only - the acceptance tests self-skip without TF_ACC=1, which
      # only `make testacc` sets. Injecting live workspace credentials into every matrix leg was
      # standing exposure for no benefit. If acceptance tests are wanted in CI they belong in a
      # separate workflow scoped to a GitHub Environment with required reviewers and a throwaway
      # workspace, not in the unit-test matrix on every PR.
    strategy:
      # without this a single platform failing cancels the others, which masks whether the
      # failure is platform-specific
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      # if we don't do this, `gofmt` will want to rewrite all Go files due to bad line endings,
      # because Git will convert all line endings to CRLF when cloning on windows
      - name: Set Git to use Linux-style line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install Go
        uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: "1.24"

      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  # The race detector has never run in CI. Since #247 the provider carries a package-level keyed
  # mutex, a sync.Map and per-target write serialisation, so a data race there would be a real
  # user-facing bug that `make test` (no -race) cannot catch. -race roughly doubles runtime, so it
  # runs once on ubuntu rather than across the full platform matrix - a race is not platform-specific.
  race:
    env:
      GOFLAGS: "-mod=vendor"
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: "1.24"

      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Race
        run: make race